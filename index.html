<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f7fb;
      font-family: Arial, sans-serif;
    }

    svg {
      width: min(95vw, 800px);
      height: auto;
      border: 3px solid #2f4858;
      border-radius: 10px;
      box-shadow: 0 5px 14px rgba(47, 72, 88, 0.18);
      background: #bfe8ff;
    }

    figure {
      margin: 1rem 0;
      text-align: center;
    }

    #scene-annotated #annotations {
      font-size: 12px;
      fill: #333;
      pointer-events: none;
    }

    #scene-annotated #annotations line {
      stroke: #666;
      stroke-width: 1;
    }

    #scene-annotated #annotations text {
      stroke: #fff;
      stroke-width: 3px;
      stroke-linejoin: round;
      paint-order: stroke;
      pointer-events: none;
    }

    /* Adjusted scene: strengthen selected contrasts and vary outlines. */
    #scene-adjusted .adjusted-grass {
      fill: #72ad5c;
    }

    #scene-adjusted .adjusted-house {
      fill: #ffd18a;
      stroke: #543821;
      stroke-width: 4;
    }

    #scene-adjusted .adjusted-roof {
      fill: #a83b35;
      stroke: #543821;
      stroke-width: 6;
    }

    #scene-adjusted .adjusted-chimney {
      stroke: #543821;
      stroke-width: 3;
    }

    #scene-adjusted .adjusted-fence {
      stroke: #784d19;
      stroke-width: 7;
      stroke-dasharray: 10 6;
    }

    #scene-adjusted .adjusted-fence-rail {
      stroke: #603c18;
      stroke-width: 5;
    }

    #scene-adjusted .adjusted-path {
      fill: #c9c4b5;
      stroke: #68665d;
      stroke-width: 2;
    }

    #scene-adjusted .mailbox {
      fill: #315e78;
      stroke: #1d394b;
      stroke-width: 2;
    }

    #scene-adjusted .smoke {
      fill: #fff;
      stroke: #8d999e;
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <figure id="scene-original">
    <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">A house and garden scene</title>
    <desc id="scene-desc">A sunny garden with a cloud, tree, fenced house, curved path, and caption.</desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe8ff"></rect>
    <rect x="0" y="330" width="800" height="170" fill="#8dcc72"></rect>

    <!-- Sun and cloud -->
    <circle cx="680" cy="85" r="48" fill="#ffd45c" stroke="#e6a82e" stroke-width="4"></circle>
    <ellipse cx="165" cy="105" rx="78" ry="27" fill="#ffffff" opacity="0.9"></ellipse>
    <circle cx="115" cy="103" r="30" fill="#ffffff" opacity="0.9"></circle>
    <circle cx="190" cy="91" r="36" fill="#ffffff" opacity="0.9"></circle>

    <!-- Tree -->
    <rect x="92" y="260" width="30" height="115" fill="#7b4b2a"></rect>
    <circle cx="108" cy="220" r="63" fill="#4e9b51"></circle>
    <circle cx="62" cy="246" r="43" fill="#5eaa56"></circle>
    <circle cx="157" cy="246" r="46" fill="#438b49"></circle>

    <!-- House body, roof, and chimney -->
    <rect x="285" y="245" width="285" height="190" fill="#f4c27a" stroke="#70452e" stroke-width="5"></rect>
    <polygon points="255,250 425,115 600,250" fill="#b65343" stroke="#70452e" stroke-width="5"></polygon>
    <rect x="500" y="155" width="43" height="76" fill="#8d5a43" stroke="#70452e" stroke-width="5"></rect>
    <line x1="493" y1="155" x2="550" y2="155" stroke="#70452e" stroke-width="7"></line>

    <!-- Door and windows -->
    <rect x="390" y="330" width="70" height="105" rx="4" fill="#71472f" stroke="#503020" stroke-width="4"></rect>
    <circle cx="445" cy="384" r="5" fill="#f7d36a"></circle>
    <rect x="315" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
    <line x1="346" y1="282" x2="346" y2="338" stroke="#70452e" stroke-width="4"></line>
    <line x1="315" y1="310" x2="377" y2="310" stroke="#70452e" stroke-width="4"></line>
    <rect x="483" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
    <line x1="514" y1="282" x2="514" y2="338" stroke="#70452e" stroke-width="4"></line>
    <line x1="483" y1="310" x2="545" y2="310" stroke="#70452e" stroke-width="4"></line>

    <!-- Fence -->
    <polyline points="20,370 20,315 55,315 55,370 90,370 90,315 125,315 125,370 160,370 160,315 195,315 195,370" fill="none" stroke="#d7a34a" stroke-width="9" stroke-linejoin="round"></polyline>
    <line x1="10" y1="345" x2="205" y2="345" stroke="#a97832" stroke-width="7"></line>

    <!-- Curved garden path -->
    <path d="M 425 435 C 430 455, 520 465, 620 500 L 300 500 C 360 465, 405 450, 425 435 Z" fill="#d8bd8a" stroke="#aa8c5b" stroke-width="3"></path>

    <!-- Flowers -->
    <circle cx="235" cy="410" r="7" fill="#e95c70"></circle>
    <circle cx="250" cy="420" r="7" fill="#f0c64d"></circle>
    <circle cx="265" cy="405" r="7" fill="#a665d1"></circle>
    <line x1="235" y1="417" x2="235" y2="445" stroke="#3e8247" stroke-width="3"></line>
    <line x1="250" y1="427" x2="250" y2="450" stroke="#3e8247" stroke-width="3"></line>
    <line x1="265" y1="412" x2="265" y2="442" stroke="#3e8247" stroke-width="3"></line>

    <text x="400" y="480" text-anchor="middle" fill="#365b38" font-size="22" font-weight="bold">Welcome to our house and garden</text>
  </svg>
    <figcaption>Original scene</figcaption>
  </figure>

  <figure id="scene-annotated-figure">
    <svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-desc">
      <title id="scene-annotated-title">A house and garden scene with SVG shape annotations</title>
      <desc id="scene-annotated-desc">The original garden scene with labels identifying SVG shape attributes.</desc>

      <!-- Sky and grass -->
      <rect x="0" y="0" width="800" height="330" fill="#bfe8ff"></rect>
      <rect x="0" y="330" width="800" height="170" fill="#8dcc72"></rect>

      <!-- Sun and cloud -->
      <circle cx="680" cy="85" r="48" fill="#ffd45c" stroke="#e6a82e" stroke-width="4"></circle>
      <ellipse cx="165" cy="105" rx="78" ry="27" fill="#ffffff" opacity="0.9"></ellipse>
      <circle cx="115" cy="103" r="30" fill="#ffffff" opacity="0.9"></circle>
      <circle cx="190" cy="91" r="36" fill="#ffffff" opacity="0.9"></circle>

      <!-- Tree -->
      <rect x="92" y="260" width="30" height="115" fill="#7b4b2a"></rect>
      <circle cx="108" cy="220" r="63" fill="#4e9b51"></circle>
      <circle cx="62" cy="246" r="43" fill="#5eaa56"></circle>
      <circle cx="157" cy="246" r="46" fill="#438b49"></circle>

      <!-- House body, roof, and chimney -->
      <rect x="285" y="245" width="285" height="190" fill="#f4c27a" stroke="#70452e" stroke-width="5"></rect>
      <polygon points="255,250 425,115 600,250" fill="#b65343" stroke="#70452e" stroke-width="5"></polygon>
      <rect x="500" y="155" width="43" height="76" fill="#8d5a43" stroke="#70452e" stroke-width="5"></rect>
      <line x1="493" y1="155" x2="550" y2="155" stroke="#70452e" stroke-width="7"></line>

      <!-- Door and windows -->
      <rect x="390" y="330" width="70" height="105" rx="4" fill="#71472f" stroke="#503020" stroke-width="4"></rect>
      <circle cx="445" cy="384" r="5" fill="#f7d36a"></circle>
      <rect x="315" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
      <line x1="346" y1="282" x2="346" y2="338" stroke="#70452e" stroke-width="4"></line>
      <line x1="315" y1="310" x2="377" y2="310" stroke="#70452e" stroke-width="4"></line>
      <rect x="483" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
      <line x1="514" y1="282" x2="514" y2="338" stroke="#70452e" stroke-width="4"></line>
      <line x1="483" y1="310" x2="545" y2="310" stroke="#70452e" stroke-width="4"></line>

      <!-- Fence -->
      <polyline points="20,370 20,315 55,315 55,370 90,370 90,315 125,315 125,370 160,370 160,315 195,315 195,370" fill="none" stroke="#d7a34a" stroke-width="9" stroke-linejoin="round"></polyline>
      <line x1="10" y1="345" x2="205" y2="345" stroke="#a97832" stroke-width="7"></line>

      <!-- Curved garden path -->
      <path d="M 425 435 C 430 455, 520 465, 620 500 L 300 500 C 360 465, 405 450, 425 435 Z" fill="#d8bd8a" stroke="#aa8c5b" stroke-width="3"></path>

      <!-- Flowers -->
      <circle cx="235" cy="410" r="7" fill="#e95c70"></circle>
      <circle cx="250" cy="420" r="7" fill="#f0c64d"></circle>
      <circle cx="265" cy="405" r="7" fill="#a665d1"></circle>
      <line x1="235" y1="417" x2="235" y2="445" stroke="#3e8247" stroke-width="3"></line>
      <line x1="250" y1="427" x2="250" y2="450" stroke="#3e8247" stroke-width="3"></line>
      <line x1="265" y1="412" x2="265" y2="442" stroke="#3e8247" stroke-width="3"></line>

      <text x="400" y="480" text-anchor="middle" fill="#365b38" font-size="22" font-weight="bold">Welcome to our house and garden</text>

      <g id="annotations">
        <line x1="530" y1="39" x2="647" y2="58"></line>
        <text x="515" y="34">circle: cx=680, cy=85, r=48</text>

        <line x1="20" y1="153" x2="104" y2="115"></line>
        <text x="20" y="148">ellipse: cx=165, cy=105, rx=78, ry=27</text>

        <line x1="20" y1="24" x2="4" y2="42"></line>
        <text x="20" y="20">rect: x=0, y=0, width=800, height=330</text>

        <line x1="558" y1="174" x2="550" y2="155"></line>
        <text x="560" y="174">line: (493,155) to (550,155)</text>

        <line x1="52" y1="296" x2="55" y2="315"></line>
        <text x="18" y="291">polyline: (20,370) (20,315) (55,315)</text>

        <line x1="405" y1="101" x2="425" y2="115"></line>
        <text x="270" y="96">polygon: (255,250) (425,115) (600,250)</text>

        <line x1="570" y1="419" x2="605" y2="472"></line>
        <text x="568" y="400">path: M425 435 C430 455,520 465,620 500</text>
        <text x="568" y="414">L300 500 C360 465 ...</text>

        <line x1="400" y1="457" x2="400" y2="475"></line>
        <text x="400" y="452" text-anchor="middle">text: x=400, y=480</text>
      </g>
    </svg>
    <figcaption>Annotated scene (Step 2)</figcaption>
  </figure>

  <figure id="scene-adjusted-figure">
    <svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc">
      <title id="scene-adjusted-title">An adjusted house and garden scene</title>
      <desc id="scene-adjusted-desc">A balanced garden scene with a dashed fence, stone path, mailbox, and chimney smoke.</desc>

      <!-- Sky and higher-contrast grass -->
      <rect x="0" y="0" width="800" height="330" fill="#bfe8ff"></rect>
      <rect class="adjusted-grass" x="0" y="330" width="800" height="170"></rect>

      <!-- Sun and cloud -->
      <circle cx="680" cy="85" r="48" fill="#ffd45c" stroke="#e6a82e" stroke-width="4"></circle>
      <ellipse cx="165" cy="105" rx="78" ry="27" fill="#ffffff" opacity="0.9"></ellipse>
      <circle cx="115" cy="103" r="30" fill="#ffffff" opacity="0.9"></circle>
      <circle cx="190" cy="91" r="36" fill="#ffffff" opacity="0.9"></circle>

      <!-- Nudge the tree right to balance the shifted house. -->
      <g transform="translate(12 0)">
        <rect x="92" y="260" width="30" height="115" fill="#7b4b2a"></rect>
        <circle cx="108" cy="220" r="63" fill="#4e9b51" stroke="#2f6835" stroke-width="2"></circle>
        <circle cx="62" cy="246" r="43" fill="#5eaa56" stroke="#2f6835" stroke-width="2"></circle>
        <circle cx="157" cy="246" r="46" fill="#438b49" stroke="#2f6835" stroke-width="2"></circle>
      </g>

      <!-- Shift the house slightly right and strengthen its outlines. -->
      <g transform="translate(8 0)">
        <!-- Smoke drifts upward from the chimney. -->
        <ellipse class="smoke" cx="523" cy="143" rx="9" ry="6" opacity="0.7"></ellipse>
        <ellipse class="smoke" cx="534" cy="128" rx="12" ry="8" opacity="0.55"></ellipse>
        <ellipse class="smoke" cx="548" cy="110" rx="15" ry="10" opacity="0.4"></ellipse>

        <!-- House body, roof, and chimney -->
        <rect class="adjusted-house" x="285" y="245" width="285" height="190"></rect>
        <polygon class="adjusted-roof" points="255,250 425,115 600,250"></polygon>
        <rect class="adjusted-chimney" x="500" y="155" width="43" height="76" fill="#8d5a43"></rect>
        <line x1="493" y1="155" x2="550" y2="155" stroke="#543821" stroke-width="6"></line>

        <!-- Door and windows -->
        <rect x="390" y="330" width="70" height="105" rx="4" fill="#71472f" stroke="#3b2418" stroke-width="3"></rect>
        <circle cx="445" cy="384" r="5" fill="#f7d36a"></circle>
        <rect x="315" y="282" width="62" height="56" fill="#a8e2ef" stroke="#543821" stroke-width="4"></rect>
        <line x1="346" y1="282" x2="346" y2="338" stroke="#543821" stroke-width="3"></line>
        <line x1="315" y1="310" x2="377" y2="310" stroke="#543821" stroke-width="3"></line>
        <rect x="483" y="282" width="62" height="56" fill="#a8e2ef" stroke="#543821" stroke-width="4"></rect>
        <line x1="514" y1="282" x2="514" y2="338" stroke="#543821" stroke-width="3"></line>
        <line x1="483" y1="310" x2="545" y2="310" stroke="#543821" stroke-width="3"></line>
      </g>

      <!-- Dashed fence with varied-width rails. -->
      <polyline class="adjusted-fence" points="20,370 20,315 55,315 55,370 90,370 90,315 125,315 125,370 160,370 160,315 195,315 195,370" fill="none" stroke-linejoin="round"></polyline>
      <line class="adjusted-fence-rail" x1="10" y1="345" x2="205" y2="345"></line>

      <!-- Curved garden path and the added stone walk to the shifted door. -->
      <path d="M 425 435 C 430 455, 520 465, 620 500 L 300 500 C 360 465, 405 450, 425 435 Z" fill="#d8bd8a" stroke="#aa8c5b" stroke-width="3"></path>
      <path class="adjusted-path" d="M 433 434 C 432 451, 437 465, 424 490 L 458 490 C 445 465, 450 451, 449 434 Z"></path>

      <!-- Mailbox beside the walk. -->
      <rect class="mailbox" x="480" y="414" width="5" height="28"></rect>
      <rect class="mailbox" x="466" y="393" width="32" height="21" rx="2"></rect>
      <polygon class="mailbox" points="462,394 482,381 502,394"></polygon>

      <!-- Flowers -->
      <circle cx="235" cy="410" r="7" fill="#e95c70"></circle>
      <circle cx="250" cy="420" r="7" fill="#f0c64d"></circle>
      <circle cx="265" cy="405" r="7" fill="#a665d1"></circle>
      <line x1="235" y1="417" x2="235" y2="445" stroke="#3e8247" stroke-width="3"></line>
      <line x1="250" y1="427" x2="250" y2="450" stroke="#3e8247" stroke-width="3"></line>
      <line x1="265" y1="412" x2="265" y2="442" stroke="#3e8247" stroke-width="3"></line>

      <text x="400" y="480" text-anchor="middle" fill="#294b2d" font-size="22" font-weight="bold">Welcome to our house and garden</text>
    </svg>
    <figcaption>Adjusted scene (Step 3)</figcaption>
  </figure>

  <figure id="scene-grouped-figure">
    <svg id="scene-grouped" viewBox="0 0 800 500" role="img" aria-labelledby="scene-grouped-title scene-grouped-desc">
      <title id="scene-grouped-title">A house and garden scene with grouped windows</title>
      <desc id="scene-grouped-desc">The original garden scene with its two windows built from one reusable group.</desc>

      <defs>
        <!-- Grouping the frame and mullions lets both windows share one reusable shape. -->
        <g id="window">
          <rect x="0" y="0" width="35" height="30" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
          <line x1="17.5" y1="0" x2="17.5" y2="30" stroke="#70452e" stroke-width="4"></line>
          <line x1="0" y1="15" x2="35" y2="15" stroke="#70452e" stroke-width="4"></line>
        </g>
      </defs>

      <!-- Sky and grass -->
      <rect x="0" y="0" width="800" height="330" fill="#bfe8ff"></rect>
      <rect x="0" y="330" width="800" height="170" fill="#8dcc72"></rect>

      <!-- Sun and cloud -->
      <circle cx="680" cy="85" r="48" fill="#ffd45c" stroke="#e6a82e" stroke-width="4"></circle>
      <ellipse cx="165" cy="105" rx="78" ry="27" fill="#ffffff" opacity="0.9"></ellipse>
      <circle cx="115" cy="103" r="30" fill="#ffffff" opacity="0.9"></circle>
      <circle cx="190" cy="91" r="36" fill="#ffffff" opacity="0.9"></circle>

      <!-- Tree -->
      <rect x="92" y="260" width="30" height="115" fill="#7b4b2a"></rect>
      <circle cx="108" cy="220" r="63" fill="#4e9b51"></circle>
      <circle cx="62" cy="246" r="43" fill="#5eaa56"></circle>
      <circle cx="157" cy="246" r="46" fill="#438b49"></circle>

      <!-- House body, roof, and chimney -->
      <rect x="285" y="245" width="285" height="190" fill="#f4c27a" stroke="#70452e" stroke-width="5"></rect>
      <polygon points="255,250 425,115 600,250" fill="#b65343" stroke="#70452e" stroke-width="5"></polygon>
      <rect x="500" y="155" width="43" height="76" fill="#8d5a43" stroke="#70452e" stroke-width="5"></rect>
      <line x1="493" y1="155" x2="550" y2="155" stroke="#70452e" stroke-width="7"></line>

      <!-- Door and windows -->
      <rect x="390" y="330" width="70" height="105" rx="4" fill="#71472f" stroke="#503020" stroke-width="4"></rect>
      <circle cx="445" cy="384" r="5" fill="#f7d36a"></circle>
      <!-- Translations retain the original windows' top-left positions. -->
      <use href="#window" transform="translate(315 282)"></use>
      <use href="#window" transform="translate(483 282)"></use>

      <!-- Fence -->
      <polyline points="20,370 20,315 55,315 55,370 90,370 90,315 125,315 125,370 160,370 160,315 195,315 195,370" fill="none" stroke="#d7a34a" stroke-width="9" stroke-linejoin="round"></polyline>
      <line x1="10" y1="345" x2="205" y2="345" stroke="#a97832" stroke-width="7"></line>

      <!-- Curved garden path -->
      <path d="M 425 435 C 430 455, 520 465, 620 500 L 300 500 C 360 465, 405 450, 425 435 Z" fill="#d8bd8a" stroke="#aa8c5b" stroke-width="3"></path>

      <!-- Flowers -->
      <circle cx="235" cy="410" r="7" fill="#e95c70"></circle>
      <circle cx="250" cy="420" r="7" fill="#f0c64d"></circle>
      <circle cx="265" cy="405" r="7" fill="#a665d1"></circle>
      <line x1="235" y1="417" x2="235" y2="445" stroke="#3e8247" stroke-width="3"></line>
      <line x1="250" y1="427" x2="250" y2="450" stroke="#3e8247" stroke-width="3"></line>
      <line x1="265" y1="412" x2="265" y2="442" stroke="#3e8247" stroke-width="3"></line>

      <text x="400" y="480" text-anchor="middle" fill="#365b38" font-size="22" font-weight="bold">Welcome to our house and garden</text>
    </svg>
    <figcaption>Grouped windows scene (Step 4)</figcaption>
  </figure>
</body>
</html>
